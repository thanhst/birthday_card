<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Một tấm thiệp sinh nhật tương tác: mở hộp quà để nhận lời chúc ấm áp."
    />
    <meta property="og:title" content="Một món quà sinh nhật dành riêng cho bạn" />
    <meta
      property="og:description"
      content="Mở hộp quà nhỏ này để tấm thiệp sinh nhật trượt ra cùng lời chúc nồng ấm."
    />
    <meta name="theme-color" content="#f7b8c8" />
    <title>Một Món Quà Sinh Nhật</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>

    <main class="experience" aria-live="polite">
      <section class="stage stage-gift is-active" data-stage="gift">
        <p class="eyebrow">Một bất ngờ nhỏ</p>
        <h1 id="heroTitle">Có một tấm thiệp đang nằm trong hộp quà</h1>
        <p class="lead" id="heroLead">
          Chạm vào hộp quà. Thiệp sẽ trượt ra ngay, mang theo một lời chúc thật ấm.
        </p>

        <button class="gift-button" id="openGift" type="button" aria-label="Mở hộp quà">
          <span class="gift-box" aria-hidden="true">
            <span class="gift-shadow"></span>
            <span class="gift-card-slip">
              <span class="slip-eyebrow">Birthday Card</span>
              <span class="slip-title">For You</span>
              <span class="slip-lines"></span>
            </span>
            <span class="gift-lid">
              <span class="gift-bow gift-bow-left"></span>
              <span class="gift-bow gift-bow-right"></span>
              <span class="gift-lid-ribbon"></span>
            </span>
            <span class="gift-base">
              <span class="gift-ribbon-vertical"></span>
              <span class="gift-ribbon-horizontal"></span>
            </span>
            <span class="gift-light"></span>
          </span>
          <span class="button-label">Mở hộp quà</span>
        </button>
      </section>

      <section class="stage stage-final" data-stage="final">
        <article class="final-card">
          <div class="floral-ring" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <p class="eyebrow">Tấm thiệp dành riêng cho bạn</p>
          <h2 id="finalTitle">Chúc mừng sinh nhật</h2>
          <div class="warm-message" id="warmMessage"></div>
          <p class="signature" id="signature"></p>
          <div class="final-actions">
            <button class="primary-action" id="celebrateAgain" type="button">
              Mở lại
            </button>
            <button class="ghost-action" id="sparkAgain" type="button">
              Thêm pháo hoa
            </button>
          </div>
        </article>
      </section>
    </main>

    <div class="progress-dots" aria-label="Tiến trình mở quà">
      <span class="is-active" data-dot="gift"></span>
      <span data-dot="final"></span>
    </div>

    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
