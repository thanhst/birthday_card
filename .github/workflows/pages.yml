name: Publish Birthday Card

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish static files to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          export SITE_DIR="$(mktemp -d)"
          cp index.html styles.css script.js README.md .nojekyll "$SITE_DIR"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$SITE_DIR"/. .
          git add .
          git commit -m "Publish birthday card to GitHub Pages"
          git push origin gh-pages --force
